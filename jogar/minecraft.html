<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cidade AI — Modo Blocos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; user-select:none; color:#fff; }
  canvas#gl { display:block; position:fixed; inset:0; }
  .hud { position:fixed; z-index:5; }
  #crosshair { left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; opacity:.9; display:none; }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:#fff; mix-blend-mode:difference; }
  #crosshair::before { left:9px; top:0; width:4px; height:22px; } #crosshair::after { top:9px; left:0; height:4px; width:22px; }
  #hotbar { left:50%; bottom:14px; transform:translateX(-50%); display:none; gap:4px; background:rgba(0,0,0,.35); padding:4px; border:3px solid #111; border-radius:3px; }
  .slot { width:50px; height:50px; border:3px solid #3a3a3a; background:#0008; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; }
  .slot.sel { border-color:#fff; box-shadow:0 0 0 2px #fff; }
  .slot canvas { width:34px; height:34px; image-rendering:pixelated; }
  .slot .n { position:absolute; right:3px; bottom:1px; font-size:12px; font-weight:800; text-shadow:1px 1px #000; }
  .slot .k { position:absolute; left:3px; top:0; font-size:10px; color:#bbb; text-shadow:1px 1px #000; }
  #vidaWrap { left:calc(50% - 158px); bottom:72px; display:none; gap:1px; }
  #fomeWrap { left:calc(50% + 2px); bottom:72px; display:none; gap:1px; }
  #vidaWrap span,#fomeWrap span { font-size:17px; filter:drop-shadow(1px 1px 0 #000); }
  #breakbar { left:50%; top:calc(50% + 22px); transform:translateX(-50%); width:70px; height:7px; background:#0007; border:1px solid #000; display:none; }
  #breakbar i { display:block; height:100%; width:0; background:#ddd; }
  #dica { left:50%; top:12px; transform:translateX(-50%); font-size:13px; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:4px; display:none; text-align:center; max-width:90vw; }
  #aviso { left:50%; top:40%; transform:translate(-50%,-50%); font-size:22px; font-weight:800; color:#ffd21e; text-shadow:2px 2px 0 #000; display:none; text-align:center; z-index:7; pointer-events:none; }
  #voltar { left:12px; top:12px; font-weight:800; background:rgba(0,0,0,.5); border:2px solid #666; padding:8px 12px; border-radius:4px; cursor:pointer; display:none; z-index:6; color:#fff; }
  /* INVENTÁRIO + CRAFT */
  #inv { position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #inv .cx { background:#c6c6c6; border:4px solid #555; border-top-color:#fff; border-left-color:#fff; padding:14px; border-radius:3px; display:flex; gap:16px; max-height:92vh; }
  #inv h3 { color:#333; margin-bottom:8px; letter-spacing:1px; font-size:15px; }
  #inv .col { display:flex; flex-direction:column; }
  #invGrid { display:grid; grid-template-columns:repeat(8,44px); gap:4px; overflow:auto; }
  #invGrid .slot { width:44px; height:44px; background:#8b8b8b; border:2px solid #373737; border-top-color:#fff; border-left-color:#fff; }
  #invGrid .slot canvas { width:30px; height:30px; }
  #craftList { width:270px; max-height:70vh; overflow:auto; }
  .rec { display:flex; align-items:center; gap:8px; background:#9a9a9a; border:2px solid #555; border-top-color:#eee; padding:5px; margin-bottom:5px; color:#222; font-size:12px; }
  .rec canvas { width:30px; height:30px; image-rendering:pixelated; }
  .rec .info { flex:1; } .rec .custo { color:#444; font-size:11px; }
  .rec button { font-weight:800; padding:5px 9px; border:2px solid #333; background:#6aa84f; color:#fff; cursor:pointer; border-radius:3px; }
  .rec button:disabled { background:#999; cursor:default; }
  /* MENU */
  #menu { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #menu .capa { position:absolute; inset:0; background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55)); }
  #menu .wrap { position:relative; display:flex; flex-direction:column; align-items:center; z-index:2; }
  .logo { position:relative; margin-bottom:2px; }
  .titulo { font-weight:900; letter-spacing:12px; font-size:clamp(38px,9vw,82px); color:#cfcfcf; text-transform:uppercase; line-height:1;
    text-shadow: 3px 3px 0 #6a6a6a, 6px 6px 0 #3a3a3a, 9px 11px 0 rgba(0,0,0,.45); -webkit-text-stroke:3px #2a2a2a; }
  .splash { position:absolute; right:-6px; bottom:-10px; color:#ffd21e; font-weight:800; font-size:clamp(13px,2.6vw,20px); transform:rotate(-18deg); text-shadow:2px 2px 0 #7a5a00; animation:bob .6s ease-in-out infinite alternate; }
  @keyframes bob { from{transform:rotate(-18deg) scale(1)} to{transform:rotate(-18deg) scale(1.1)} }
  .rodape { position:absolute; left:0; right:0; bottom:8px; display:flex; justify-content:space-between; padding:0 14px; z-index:2; color:#fff; font-size:13px; text-shadow:1px 1px 0 #000; }
  .rodape span { background:rgba(0,0,0,.35); padding:5px 9px; border-radius:4px; }
  .social { position:absolute; right:14px; top:12px; z-index:2; color:#fff; font-size:14px; background:rgba(0,0,0,.35); padding:6px 10px; border-radius:4px; text-shadow:1px 1px 0 #000; }
  .btns { display:flex; flex-direction:column; gap:11px; margin-top:20px; width:min(360px,86vw); }
  .mcbtn { font-weight:800; letter-spacing:2px; font-size:21px; color:#fff; text-shadow:2px 2px 0 #1a1a1a; text-transform:uppercase; padding:13px; cursor:pointer; border-radius:3px;
    background:linear-gradient(#8f8f8f,#7a7a7a); border:3px solid #2e2e2e; border-top-color:#a9a9a9; border-bottom-width:6px; }
  .mcbtn:hover { background:linear-gradient(#a7bd86,#8fae6a); border-color:#fff; }
  .mcbtn:active { border-bottom-width:3px; transform:translateY(3px); }
  .mcbtn.modo { font-size:18px; } .mcbtn.modo b { color:#ffd21e; }
  #modsPanel { position:fixed; inset:0; z-index:11; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); }
  #modsPanel .cx { background:#5a5a5a; border:4px solid #2a2a2a; border-radius:4px; padding:18px; width:min(420px,90vw); max-height:88vh; overflow:auto; }
  #modsPanel h2 { color:#ffd21e; letter-spacing:2px; margin-bottom:12px; text-align:center; text-shadow:2px 2px 0 #000; }
  .modrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px; background:#0004; border:2px solid #333; margin-bottom:7px; font-size:15px; }
  .modrow button { font-weight:800; padding:6px 14px; border:2px solid #222; background:#7a7a7a; color:#fff; cursor:pointer; border-radius:3px; }
  .modrow button.on { background:#3faa3f; }
  /* BAÚ / FORNALHA */
  #recip { position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #recip .cx { background:#c6c6c6; border:4px solid #555; border-top-color:#fff; border-left-color:#fff; padding:14px; border-radius:3px; width:min(430px,94vw); }
  #recip h3 { color:#333; font-size:14px; letter-spacing:1px; margin-bottom:6px; }
  #recipCont { min-height:50px; }
  #recipCont, #recipInv { display:grid; grid-template-columns:repeat(9,42px); gap:4px; }
  #recipCont .slot,#recipInv .slot { width:42px; height:42px; background:#8b8b8b; border:2px solid #373737; border-top-color:#fff; border-left-color:#fff; }
  #recipCont .slot canvas,#recipInv .slot canvas { width:30px; height:30px; }
  /* IA */
  #iaBox { position:fixed; inset:0; z-index:12; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #iaBox .cx { background:#2c2c3a; border:3px solid #6b6bd8; border-radius:8px; padding:18px; width:min(480px,94vw); }
  #iaBox h3 { color:#bdbdff; margin-bottom:10px; }
  #iaInput { width:100%; padding:11px; font-size:15px; border-radius:6px; border:2px solid #555; background:#1a1a26; color:#fff; font-family:inherit; }
  #iaDicas { color:#9a9ac4; font-size:11px; margin-top:6px; }
  /* PAUSA */
  #pause { position:fixed; inset:0; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(0,0,0,.55); }
  #pause h2 { letter-spacing:3px; font-size:30px; text-shadow:2px 2px 0 #000; margin-bottom:6px; }
  #pause .mcbtn { width:min(320px,80vw); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="crosshair" class="hud"></div>
<div id="breakbar" class="hud"><i></i></div>
<div id="vidaWrap" class="hud"></div>
<div id="fomeWrap" class="hud"></div>
<div id="dica" class="hud"></div>
<div id="aviso" class="hud"></div>
<button id="voltar">‹ Menu</button>
<div id="hotbar" class="hud"></div>
<div id="inv"><div class="cx">
  <div class="col"><h3>INVENTÁRIO</h3><div id="invGrid"></div></div>
  <div class="col"><h3>CRAFT — faça ferramentas</h3><div id="craftList"></div></div>
</div></div>
<div id="recip"><div class="cx">
  <h3 id="recipTit">BAÚ</h3><div id="recipCont"></div>
  <h3 style="margin-top:10px">Seu inventário (clique pra guardar)</h3><div id="recipInv"></div>
  <button class="mcbtn" id="recipFechar" style="margin-top:10px;font-size:15px;width:100%">Fechar</button>
</div></div>
<div id="iaBox"><div class="cx">
  <h3>🤖 IA / Comandos — escreve e ela faz</h3>
  <input id="iaInput" placeholder="ex: casa, torre de diamante, piscina, piramide, spawn vaca 5, me da diamante 64, dia, noite">
  <div id="iaDicas"></div>
  <div style="display:flex;gap:8px;margin-top:8px"><button class="mcbtn" id="iaEnviar" style="flex:1;font-size:15px">Fazer</button><button class="mcbtn" id="iaFechar" style="font-size:15px">Fechar</button></div>
</div></div>
<div id="pause"><h2>Pausado</h2><button class="mcbtn" id="pContinuar">Continuar</button><button class="mcbtn" id="pSair">Sair pro Menu</button></div>
<div id="menu"><div class="capa"></div><div class="wrap">
  <div class="logo"><div class="titulo">Cidade AI</div><div class="splash">Let's dance!</div></div>
  <div class="btns">
    <button class="mcbtn" id="bPlay">Jogar</button>
    <button class="mcbtn modo" id="bModo">Modo: <b>Sobrevivência</b></button>
    <button class="mcbtn" id="bMake">Criar (mundo plano)</button>
    <button class="mcbtn" id="bMods">Definições</button>
    <button class="mcbtn" id="bSairJogo" style="font-size:16px;background:linear-gradient(#7a5a5a,#6a4a4a)">◀ Sair (voltar à Cidade AI)</button>
  </div>
</div>
<div class="rodape"><span>👤 Perfil</span><span id="versao">Cidade AI · Modo Blocos v3</span></div>
<div class="social">🧑‍🤝‍🧑 Social (0)</div>
</div>
<div id="modsPanel"><div class="cx"><h2>MODS</h2><div id="modsList"></div>
  <button class="mcbtn" id="modsFechar" style="width:100%;margin-top:6px;font-size:18px">Voltar</button></div></div>

<script type="module">
import * as THREE from './static/three.module.min.js';
const $ = s => document.querySelector(s);

// ============================================================ ATLAS (pixel, estilo Minecraft)
const TS = 16, COLS = 8, ROWS = 4;
const atlasCv = document.createElement('canvas'); atlasCv.width = COLS * TS; atlasCv.height = ROWS * TS;
const ag = atlasCv.getContext('2d');
let _ti = 0; const TILE = {};
function rnd(x, y, s) { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5; return v - Math.floor(v); }
function tile(nome, draw) { const i = _ti++, tx = i % COLS, ty = (i / COLS | 0); TILE[nome] = i; const o = { x: tx * TS, y: ty * TS };
  draw((x, y, c) => { ag.fillStyle = c; ag.fillRect(o.x + x, o.y + y, 1, 1); }, (x, y, w, h, c) => { ag.fillStyle = c; ag.fillRect(o.x + x, o.y + y, w, h); }); }
const sh = (r, g, b, d) => `rgb(${Math.max(0, Math.min(255, r + d)) | 0},${Math.max(0, Math.min(255, g + d)) | 0},${Math.max(0, Math.min(255, b + d)) | 0})`;
function ruidoTile(px, [r, g, b], amp, seed) { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) px(x, y, sh(r, g, b, (rnd(x, y, seed) - .5) * amp)); }
tile('grass_top', (px) => { ruidoTile(px, [96, 158, 56], 46, 1); for (let i = 0; i < 40; i++) px(rnd(i, 1, 2) * TS | 0, rnd(i, 2, 3) * TS | 0, sh(70, 130, 40, (rnd(i, 3, 4) - .5) * 30)); });
tile('grass_side', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { if (y < 4 + (rnd(x, 0, 5) * 2 | 0)) px(x, y, sh(96, 158, 56, (rnd(x, y, 6) - .5) * 40)); else px(x, y, sh(134, 100, 58, (rnd(x, y, 7) - .5) * 46)); } });
tile('dirt', (px) => { ruidoTile(px, [134, 100, 58], 50, 8); for (let i = 0; i < 18; i++) px(rnd(i, 1, 9) * TS | 0, rnd(i, 2, 9) * TS | 0, sh(110, 80, 46, 0)); });
tile('stone', (px) => { ruidoTile(px, [128, 128, 128], 34, 11); for (let i = 0; i < 6; i++) { const x = rnd(i, 1, 12) * TS | 0, y = rnd(i, 2, 12) * TS | 0; px(x, y, sh(96, 96, 96, 0)); px(x + 1, y, sh(104, 104, 104, 0)); } });
tile('cobble', (px, rc) => { for (let by = 0; by < 4; by++) for (let bx = 0; bx < 4; bx++) { const c = 100 + (rnd(bx, by, 13) * 60 | 0); rc(bx * 4, by * 4, 4, 4, sh(c, c, c, 0)); } for (let y = 0; y < TS; y += 4) rc(0, y, TS, 1, '#555'); for (let x = 0; x < TS; x += 4) rc(x, 0, 1, TS, '#555'); });
tile('plank', (px, rc) => { ruidoTile(px, [178, 142, 90], 26, 14); for (let y = 0; y < TS; y += 4) rc(0, y, TS, 1, 'rgba(90,60,30,.5)'); for (let i = 0; i < 6; i++) px(rnd(i, 0, 15) * TS | 0, rnd(i, 1, 15) * TS | 0, '#3f2a14'); });
tile('log_side', (px, rc) => { for (let x = 0; x < TS; x++) { const d = Math.sin(x * .9) * 16; for (let y = 0; y < TS; y++) px(x, y, sh(120, 92, 56, d + (rnd(x, y, 16) - .5) * 18)); } rc(0, 0, TS, 2, '#5a4328'); rc(0, TS - 2, TS, 2, '#5a4328'); });
tile('log_top', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const dx = x - 7.5, dy = y - 7.5, r = Math.hypot(dx, dy); px(x, y, sh(168, 132, 80, Math.sin(r * 2.2) * 24 - r * 2)); } });
tile('leaves', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const n = rnd(x, y, 17); if (n > .82) px(x, y, '#2c5e26'); else px(x, y, sh(60, 140, 54, (n - .5) * 60)); } });
tile('brick', (px, rc) => { rc(0, 0, TS, TS, '#9b4a3a'); for (let y = 0; y < TS; y += 4) rc(0, y, TS, 1, '#cfc4b4'); for (let y = 0; y < TS; y += 4) { const off = (y / 4) % 2 ? 4 : 0; for (let x = off; x < TS; x += 8) rc(x, y, 1, 4, '#cfc4b4'); } });
tile('sand', (px) => ruidoTile(px, [222, 206, 150], 30, 19));
tile('glass', (px, rc) => { for (let i = 0; i < TS; i++) { px(i, 0, '#dfeefc'); px(i, TS - 1, '#dfeefc'); px(0, i, '#dfeefc'); px(TS - 1, i, '#dfeefc'); } px(3, 3, '#fff'); px(4, 3, '#fff'); });
tile('wool', (px) => ruidoTile(px, [236, 236, 236], 16, 31));
function oreTile(nome, cor, cor2, seed) { tile(nome, (px, rc) => { ruidoTile(px, [128, 128, 128], 30, 11); for (let i = 0; i < 7; i++) { const x = 2 + (rnd(i, 1, seed) * 11 | 0), y = 2 + (rnd(i, 2, seed) * 11 | 0); rc(x, y, 3, 2, cor); px(x, y, cor2); px(x + 2, y + 1, cor2); } }); }
oreTile('ore_coal', '#1e1e1e', '#444', 21); oreTile('ore_iron', '#c49a6c', '#e8c9a0', 22); oreTile('ore_gold', '#e8c63a', '#fff09a', 23); oreTile('ore_diamond', '#4fe3d6', '#c8fff8', 24);
tile('bedrock', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const c = 40 + (rnd(x >> 1, y >> 1, 25) * 50 | 0); px(x, y, sh(c, c, c, 0)); } });
tile('water', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const w = Math.sin(x * .8 + y * .5) * 14; px(x, y, sh(44, 94, 196, w)); } });
tile('lava', (px) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const w = Math.sin(x * .7 + y * .6) * 30; px(x, y, sh(210, 90, 20, w)); } for (let i = 0; i < 6; i++) px(rnd(i, 1, 41) * TS | 0, rnd(i, 2, 41) * TS | 0, '#ffe070'); });
tile('chest_top', (px, rc) => { ruidoTile(px, [150, 108, 60], 20, 14); rc(0, 0, TS, 1, '#5a4024'); rc(0, TS - 1, TS, 1, '#5a4024'); rc(7, 6, 2, 3, '#3a2a14'); });
tile('chest', (px, rc) => { ruidoTile(px, [160, 116, 64], 20, 15); rc(0, 0, TS, 2, '#5a4024'); rc(0, 7, TS, 2, '#5a4024'); rc(0, TS - 1, TS, 1, '#5a4024'); rc(7, 7, 2, 4, '#3a2a14'); rc(6, 8, 4, 1, '#caa64e'); });
tile('furnace', (px) => ruidoTile(px, [104, 104, 104], 28, 11));
tile('furnace_front', (px, rc) => { ruidoTile(px, [104, 104, 104], 26, 11); rc(4, 7, 8, 7, '#2a2a2a'); rc(5, 9, 6, 4, '#000'); rc(5, 11, 6, 2, '#e86a1e'); rc(6, 12, 4, 1, '#ffd060'); });
const atlasTex = new THREE.CanvasTexture(atlasCv); atlasTex.magFilter = THREE.NearestFilter; atlasTex.minFilter = THREE.NearestFilter; atlasTex.colorSpace = THREE.SRGBColorSpace;
function uvTile(i) { const tx = i % COLS, ty = (i / COLS | 0), e = .002; return [(tx + e) / COLS, 1 - (ty + 1 - e) / ROWS, (tx + 1 - e) / COLS, 1 - (ty + e) / ROWS]; }

// ============================================================ BLOCOS
const BLOCOS = [ null,
  { nome: 'Grama', faces: ['grass_top', 'grass_side', 'dirt'], dur: .7, cat: 'pa', solta: 'Terra' },
  { nome: 'Terra', faces: ['dirt', 'dirt', 'dirt'], dur: .6, cat: 'pa' },
  { nome: 'Pedra', faces: ['stone', 'stone', 'stone'], dur: 1.6, cat: 'picareta', nivel: 1, solta: 'Pedregulho' },
  { nome: 'Pedregulho', faces: ['cobble', 'cobble', 'cobble'], dur: 1.8, cat: 'picareta', nivel: 1 },
  { nome: 'Tábua', faces: ['plank', 'plank', 'plank'], dur: .8, cat: 'machado' },
  { nome: 'Tronco', faces: ['log_top', 'log_side', 'log_top'], dur: 1.1, cat: 'machado' },
  { nome: 'Folha', faces: ['leaves', 'leaves', 'leaves'], dur: .25, transp: true, solta: null },
  { nome: 'Tijolo', faces: ['brick', 'brick', 'brick'], dur: 1.4, cat: 'picareta', nivel: 1 },
  { nome: 'Areia', faces: ['sand', 'sand', 'sand'], dur: .6, cat: 'pa' },
  { nome: 'Vidro', faces: ['glass', 'glass', 'glass'], dur: .35, transp: true, solta: null },
  { nome: 'Min. Carvão', faces: ['ore_coal', 'ore_coal', 'ore_coal'], dur: 2.4, cat: 'picareta', nivel: 1, solta: 'carvao' },
  { nome: 'Min. Ferro', faces: ['ore_iron', 'ore_iron', 'ore_iron'], dur: 2.8, cat: 'picareta', nivel: 2, solta: 'ferro_barra' },
  { nome: 'Min. Ouro', faces: ['ore_gold', 'ore_gold', 'ore_gold'], dur: 3.0, cat: 'picareta', nivel: 2, solta: 'ouro_barra' },
  { nome: 'Min. Diamante', faces: ['ore_diamond', 'ore_diamond', 'ore_diamond'], dur: 3.4, cat: 'picareta', nivel: 3, solta: 'diamante' },
  { nome: 'Lã', faces: ['wool', 'wool', 'wool'], dur: .5, solta: 'Lã' },
  { nome: 'Água', faces: ['water', 'water', 'water'], dur: .1, transp: true, liquido: 'agua', solta: null },
  { nome: 'Lava', faces: ['lava', 'lava', 'lava'], dur: .1, transp: true, liquido: 'lava', solta: null },
  { nome: 'Baú', faces: ['chest_top', 'chest', 'chest'], dur: 1.0, cat: 'machado', recipiente: 'bau', solta: 'Baú' },
  { nome: 'Fornalha', faces: ['furnace', 'furnace_front', 'furnace'], dur: 2.2, cat: 'picareta', nivel: 1, recipiente: 'fornalha', solta: 'Fornalha' },
  { nome: 'Bedrock', faces: ['bedrock', 'bedrock', 'bedrock'], dur: Infinity, inquebravel: true },
];
const porNome = {}; BLOCOS.forEach((b, i) => { if (b) porNome[b.nome] = i; });
const A_AGUA = porNome['Água'], A_LAVA = porNome['Lava'];

  if (tipo === 'zumbi') { g.add(caixa(.55, .75, .3, d.cor, 0, 1.0, 0)); g.add(caixa(.4, .4, .4, 0x3c6b38, 0, 1.6, 0)); g.add(caixa(.18, .6, .2, d.cor, 0, 1.1, .32)); g.add(caixa(.18, .6, .2, d.cor, 0, 1.1, -.32)); g.add(caixa(.2, .7, .22, 0x2f5a2c, .16, .35, 0)); g.add(caixa(.2, .7, .22, 0x2f5a2c, -.16, .35, 0)); }
  else { const bl = d.larg, al = d.alt; g.add(caixa(bl, al * .55, bl * 1.3, d.cor, 0, al * .55, 0)); g.add(caixa(bl * .7, bl * .7, bl * .6, d.cor, 0, al * .7, bl * .8)); if (tipo === 'porco') g.add(caixa(.18, .14, .1, 0xd98b8b, 0, al * .62, bl * 1.1)); const ly = al * .22; for (const [sx, sz] of [[.3, .5], [-.3, .5], [.3, -.5], [-.3, -.5]]) g.add(caixa(bl * .22, ly * 2, bl * .22, 0x5a5a5a, sx * bl, ly, sz * bl)); }
  return g; }
function alturaChaoMob(x, z) { const fx = Math.floor(x), fz = Math.floor(z); for (let y = CEU; y > 0; y--) if (solido(get(fx, y, fz))) return y + 1; return 1; }
function spawnMob(tipo, x, z) { const y = alturaChaoMob(x, z); if (y < 1) return; const g = modeloMob(tipo); g.position.set(x, y, z); cena.add(g); mobs.push({ tipo, g, x, y, z, vy: 0, hp: MOBDEF[tipo].hp, hostil: !!MOBDEF[tipo].hostil, yaw: Math.random() * 6.28, tw: 0, anda: false, atk: 0 }); }
function removerMob(m) { cena.remove(m.g); m.g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); const i = mobs.indexOf(m); if (i >= 0) mobs.splice(i, 1); }
function matarMob(m) { const d = MOBDEF[m.tipo]; if (d.drop) { darItem(d.drop, 1 + (Math.random() * 2 | 0)); aviso('+ ' + nomeItem(mapKey(d.drop))); montarHotbar(); } removerMob(m); }
let spawnT = 0;
function atualizarMobs(dt) {

    const ang = Math.random() * 6.28, dist = 16 + Math.random() * 22, x = player.x + Math.cos(ang) * dist, z = player.z + Math.sin(ang) * dist;
    const nZ = mobs.reduce((s, m) => s + (m.hostil ? 1 : 0), 0), nA = mobs.length - nZ;
    if (noite) { if (nZ < 9) spawnMob('zumbi', x, z); } else if (nA < 12) { const a = ['porco', 'vaca', 'galinha', 'ovelha']; spawnMob(a[Math.random() * 4 | 0], x, z); }
  }

    const dxp = player.x - m.x, dzp = player.z - m.z, distP = Math.hypot(dxp, dzp);

    m.vy -= 20 * dt; let ny = m.y + m.vy * dt; const ch = alturaChaoMob(m.x, m.z); if (ny <= ch) { ny = ch; m.vy = 0; } m.y = ny;
    let spd = m.hostil ? 2.4 : 1.1;
    if (m.hostil && distP < 20) { m.yaw = Math.atan2(dxp, dzp); m.atk -= dt; if (distP < 1.5) { spd = 0; if (m.atk <= 0) { dano(3); m.atk = 1.1; } } }
    else { m.tw -= dt; if (m.tw <= 0) { m.tw = 2 + Math.random() * 3; m.yaw = Math.random() * 6.28; m.anda = Math.random() > .35; } if (!m.anda) spd = 0; }
    if (spd) { const nx = m.x + Math.sin(m.yaw) * spd * dt, nz = m.z + Math.cos(m.yaw) * spd * dt; const sob = alturaChaoMob(nx, nz); if (Math.abs(sob - m.y) <= 1.2 && !get(Math.floor(nx), Math.ceil(m.y) + 1, Math.floor(nz))) { m.x = nx; m.z = nz; if (sob > m.y && m.vy <= 0) m.vy = 5; } else m.tw = 0; }
    m.g.position.set(m.x, m.y, m.z); m.g.rotation.y = m.yaw;

}
function atacarMob() { cam.getWorldDirection(_dir); let melhor = null, md = 3.6;
  for (const m of mobs) { const alt = MOBDEF[m.tipo].alt; const vx = m.x - player.x, vy = (m.y + alt * .6) - (player.y + OLHO), vz = m.z - player.z; const d = Math.hypot(vx, vy, vz); if (d > md) continue; const dot = (vx * _dir.x + vy * _dir.y + vz * _dir.z) / (d || 1); if (dot > .72 && d < md) { md = d; melhor = m; } }
  if (!melhor) return false; const f = ferramentaAtual(); const dmg = f && f.cat === 'espada' ? f.mult : (f ? 2 : 1); melhor.hp -= dmg;
  const dx = melhor.x - player.x, dz = melhor.z - player.z, l = Math.hypot(dx, dz) || 1; melhor.x += dx / l * .5; melhor.z += dz / l * .5; melhor.vy = 3.5; somCavar(240);
  if (melhor.hp <= 0) matarMob(melhor); return true;
}

// ============================================================ FOME / VIDA
function desenharFome() { const w = $('#fomeWrap'); w.innerHTML = ''; for (let i = 0; i < 10; i++) { const s = document.createElement('span'); s.textContent = (i * 2 + 2) <= fome ? '🍗' : (i * 2 + 1) <= fome ? '🍖' : '▪️'; w.appendChild(s); } }
function atualizarFomeVida(dt) {
  fomeT += dt; if (fomeT > 7) { fomeT = 0; if (fome > 0) { fome = Math.max(0, fome - 1); desenharFome(); } }
  regenT += dt;
  if (fome >= 17 && vida < 20) { if (regenT > 3) { regenT = 0; vida = Math.min(20, vida + 1); desenharVida(); } }
  else if (fome === 0 && vida > 1) { if (regenT > 4) { regenT = 0; vida--; desenharVida(); } }
  else if (regenT > 3) regenT = 3;
}
function comer(key) { if (!FOODS[key]) return false; if (fome >= 20) return true; if (modo === 'sobrevivencia') { if ((invent[key] || 0) <= 0) return true; invent[key]--; } fome = Math.min(20, fome + FOODS[key]); desenharFome(); montarHotbar(); somCavar(500); return true; }

// ============================================================ IA / COMANDOS (constrói qualquer coisa)
function semAcento(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function frente(d) { cam.getWorldDirection(_dir); return { x: Math.round(player.x + _dir.x * d), y: Math.floor(player.y), z: Math.round(player.z + _dir.z * d) }; }
function remalhar(minx, minz, maxx, maxz) { const a = Math.floor(minx / CH), b = Math.floor(maxx / CH), c = Math.floor(minz / CH), e = Math.floor(maxz / CH);
  for (let cx = a; cx <= b; cx++) for (let cz = c; cz <= e; cz++) { const k = ckey(cx, cz); if (!gerados.has(k)) { gerarChunk(cx, cz); gerados.add(k); } meshChunk(cx, cz); } }
function blocoDoTexto(t) {
  const m = [['pedregulho', 'Pedregulho'], ['tijolo', 'Tijolo'], ['vidro', 'Vidro'], ['madeira', 'Tábua'], ['tabua', 'Tábua'], ['tronco', 'Tronco'], ['areia', 'Areia'], ['grama', 'Grama'], ['terra', 'Terra'],
    ['diamante', 'Min. Diamante'], ['ouro', 'Min. Ouro'], ['ferro', 'Min. Ferro'], ['carvao', 'Min. Carvão'], ['folha', 'Folha'], ['agua', 'Água'], ['lava', 'Lava'], ['bau', 'Baú'], ['fornalha', 'Fornalha'], ['pedra', 'Pedra'], ['la', 'Lã']];
  for (const [k, v] of m) if (t.includes(k)) return v; return 'Pedra';
}
function itemDoTexto(t) {
  for (const cat of ['picareta', 'machado', 'espada']) for (const mt of ['diamante', 'ferro', 'pedra', 'madeira']) if (t.includes(cat) && t.includes(mt)) return cat + '_' + mt;
  if (t.includes('pa de') || /\bpa\b/.test(t)) for (const mt of ['diamante', 'ferro', 'pedra', 'madeira']) if (t.includes(mt)) return 'pa_' + mt;
  for (const k of ['diamante', 'ouro', 'ferro', 'carvao', 'graveto', 'carne', 'frango', 'balde']) if (t.includes(k)) return k === 'ouro' ? 'ouro_barra' : k === 'ferro' ? 'ferro_barra' : k;
  return blocoDoTexto(t);
}
function encher(x0, y0, z0, x1, y1, z1, id, oco) {
  const ax = Math.min(x0, x1), bx = Math.max(x0, x1), ay = Math.min(y0, y1), by = Math.max(y0, y1), az = Math.min(z0, z1), bz = Math.max(z0, z1);
  for (let x = ax; x <= bx; x++) for (let y = ay; y <= by; y++) for (let z = az; z <= bz; z++) { if (oco && x > ax && x < bx && y > ay && y < by && z > az && z < bz) continue; set(x, y, z, id); }
  remalhar(ax, az, bx, bz);
}
function executarAcoes(acoes) {
  const b = { x: Math.floor(player.x), y: Math.floor(player.y), z: Math.floor(player.z) };
  const bid = nome => nome === 'ar' || nome === 'air' ? 0 : (porNome[nome] != null ? porNome[nome] : porNome['Pedra']);
  for (const a of (acoes || [])) { try {
    if (a.t === 'preencher' || a.t === 'fill') { const d = a.de || a.from, e = a.ate || a.to; encher(b.x + d[0], b.y + d[1], b.z + d[2], b.x + e[0], b.y + e[1], b.z + e[2], bid(a.bloco), !!a.oco); }
    else if (a.t === 'bloco' || a.t === 'set') { const p = a.em || a.at; set(b.x + p[0], b.y + p[1], b.z + p[2], bid(a.bloco)); remalhar(b.x + p[0], b.z + p[2], b.x + p[0], b.z + p[2]); }
    else if (a.t === 'bicho' || a.t === 'spawn') { if (MOBDEF[a.tipo]) { const q = Math.min(30, a.n || 1); for (let i = 0; i < q; i++) spawnMob(a.tipo, player.x + (Math.random() - .5) * 6, player.z + (Math.random() - .5) * 6); } }
    else if (a.t === 'dar' || a.t === 'item') { if (a.item) { invent[a.item] = (invent[a.item] || 0) + Math.min(400, a.n || 1); montarHotbar(); } }
    else if (a.t === 'tp') { const p = a.em; player.x = b.x + p[0]; player.y = b.y + p[1] + 1; player.z = b.z + p[2]; player.vy = 0; atualizarChunks(true); }
    else if (a.t === 'estado') { const o = a.o; if (o === 'dia') tempoDia = .25; else if (o === 'noite') tempoDia = .75; else if (o === 'voar') { MODS.voar = true; voando = true; } else if (o === 'cura') { vida = 20; fome = 20; desenharVida(); desenharFome(); } else if (o === 'limpar') for (const m of mobs.slice()) removerMob(m); }

}
async function comandoIA(txt) {
  const t = (txt || '').trim(); if (!t) return; aviso('🤖 pensando...');
  try {
    const resp = await fetch('/api/blocos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto: t }) });
    const j = await resp.json();
    if (j && Array.isArray(j.acoes)) { executarAcoes(j.acoes); aviso(j.fala || '✅ Pronto!'); return; }
  } catch (e) { }
  comandoLocal(t);   // sem servidor (web/celular): usa os comandos prontos
}
function comandoLocal(txt) {
  const t = semAcento((txt || '').toLowerCase().trim()); if (!t) return; const num = (t.match(/\d+/) || [])[0]; const n = num ? Math.min(400, +num) : null;
  const f = frente(6), bid = porNome[blocoDoTexto(t)]; let msg = '';

  else if (/\b(spawn|nasce|nascer|invoca|aparece|poe|bota).*(vaca|porco|galinha|ovelha|zumbi)|chuva de (vaca|porco|galinha|ovelha|zumbi)/.test(t)) {
    const mb = ['vaca', 'porco', 'galinha', 'ovelha', 'zumbi'].find(m => t.includes(m)) || 'porco'; const q = n || 5; for (let i = 0; i < q; i++) spawnMob(mb === 'zumbi' ? 'zumbi' : mb, player.x + (Math.random() - .5) * 6, player.z + (Math.random() - .5) * 6); msg = 'Spawnei ' + q + ' ' + mb; }
  else if (/\b(dia|amanhece)\b/.test(t)) { tempoDia = .25; msg = 'Virou dia'; }

  else if (/\b(cura|vida cheia|me cura|heal)\b/.test(t)) { vida = 20; fome = 20; desenharVida(); desenharFome(); msg = 'Curado!'; }
  else if (/\b(limpa|limpar|some|mata).*(bicho|mob|zumbi)|kill/.test(t)) { for (const m of mobs.slice()) removerMob(m); msg = 'Limpei os bichos'; }
  else if (/\b(casa|cabana)\b/.test(t)) { encher(f.x - 3, f.y, f.z - 3, f.x + 3, f.y + 4, f.z + 3, bid === porNome['Pedra'] ? porNome['Tábua'] : bid, true); set(f.x, f.y + 1, f.z - 3, 0); set(f.x, f.y + 2, f.z - 3, 0); remalhar(f.x, f.z - 3, f.x, f.z - 3); msg = 'Casa pronta!'; }
  else if (/\b(torre|pilar)\b/.test(t)) { const alt = n || 14; encher(f.x - 1, f.y, f.z - 1, f.x + 1, f.y + alt, f.z + 1, bid, true); msg = 'Torre de ' + alt + ' blocos!'; }
  else if (/\b(piramide|pirâmide)\b/.test(t)) { const s = n || 6; for (let i = 0; i <= s; i++) encher(f.x - (s - i), f.y + i, f.z - (s - i), f.x + (s - i), f.y + i, f.z + (s - i), bid, false); msg = 'Pirâmide!'; }
  else if (/\b(muralha|muro|parede|muralha)\b/.test(t)) { encher(f.x - 5, f.y, f.z, f.x + 5, f.y + 4, f.z, bid, false); msg = 'Muralha!'; }
  else if (/\b(piscina|lago|agua)\b/.test(t)) { encher(f.x - 3, f.y - 2, f.z - 3, f.x + 3, f.y - 1, f.z + 3, porNome['Pedra'], false); encher(f.x - 2, f.y - 1, f.z - 2, f.x + 2, f.y - 1, f.z + 2, A_AGUA, false); msg = 'Piscina!'; }
  else if (/\b(cubo|bloco gigante|quadrado)\b/.test(t)) { const s = n || 5; encher(f.x, f.y, f.z, f.x + s - 1, f.y + s - 1, f.z + s - 1, bid, false); msg = 'Cubo ' + s + 'x' + s + '!'; }
  else if (/\b(esfera|bola)\b/.test(t)) { const r = n || 4, cy = f.y + r; for (let x = -r; x <= r; x++) for (let y = -r; y <= r; y++) for (let z = -r; z <= r; z++) if (x * x + y * y + z * z <= r * r) set(f.x + x, cy + y, f.z + z, bid); remalhar(f.x - r, f.z - r, f.x + r, f.z + r); msg = 'Esfera!'; }
  else if (/\b(montanha|morro)\b/.test(t)) { const r = n || 8; for (let i = 0; i <= r; i++) encher(f.x - (r - i), f.y + i, f.z - (r - i), f.x + (r - i), f.y + i, f.z + (r - i), bid, false); msg = 'Montanha!'; }
  else if (/\b(escada|degrau)\b/.test(t)) { for (let i = 0; i < (n || 8); i++) set(f.x, f.y + i, f.z + i, bid); remalhar(f.x, f.z, f.x, f.z + (n || 8)); msg = 'Escada!'; }
  else if (/\b(ponte)\b/.test(t)) { encher(f.x - 1, f.y, f.z, f.x + 1, f.y, f.z + (n || 10), bid, false); msg = 'Ponte!'; }
  else { msg = 'Não entendi 😅 tenta: casa, torre de diamante, piramide, piscina, muralha, cubo de ouro, esfera, montanha, spawn vaca 5, me da diamante 64, dia, noite, voar, cura'; }
  aviso(msg);
  if (recipAberto) montarRecip();
}
function toggleIA() { if (telaMenu) return; const open = $('#iaBox').style.display !== 'flex'; $('#iaBox').style.display = open ? 'flex' : 'none'; invAberto = open; if (open) { if (travado) document.exitPointerLock(); setTimeout(() => $('#iaInput').focus(), 30); } }
$('#iaEnviar').onclick = () => { comandoIA($('#iaInput').value); $('#iaInput').value = ''; };
$('#iaInput').addEventListener('keydown', e => { if (e.code === 'Enter') { comandoIA($('#iaInput').value); $('#iaInput').value = ''; } if (e.code === 'Escape') { $('#iaFechar').onclick(); } e.stopPropagation(); });
$('#iaFechar').onclick = () => { $('#iaBox').style.display = 'none'; invAberto = false; };

// ============================================================ LOOP
let ult = performance.now();
function loop() { const agora = performance.now(), dt = Math.min(.05, (agora - ult) / 1000); ult = agora;
  if (telaMenu) { blocoMenu.rotation.y = -.4 + Math.sin(agora / 1400) * .45; blocoMenu.position.y = -.1 + Math.sin(agora / 900) * .05; renderer.render(menuScene, menuCam); }
  else {
    if (!pausado) { mover(dt); atualizarChunks(false); atualizarParticulas(dt); atualizarCeu(dt); atualizarMobs(dt); if (modo === 'sobrevivencia') atualizarFomeVida(dt);
      if (quebrando && modo === 'sobrevivencia') { const a = alvo();
        if (a && a.bx === quebrando.bx && a.by === quebrando.by && a.bz === quebrando.bz && get(a.bx, a.by, a.bz)) {
          const id = get(a.bx, a.by, a.bz), tq = tempoQuebra(id);
          if (tq === Infinity) { quebrando = null; crackMesh.visible = false; aviso('Bedrock não quebra!'); }
          else { quebraProg += dt / tq; crackMesh.position.set(a.bx + .5, a.by + .5, a.bz + .5); crackMesh.visible = true; desenharRachadura(quebraProg);
            tickSom -= dt; if (tickSom <= 0) { somCavar(380); spawnParticulas(a.bx, a.by, a.bz, id); tickSom = .22; }
            $('#breakbar').style.display = 'block'; $('#breakbar i').style.width = Math.min(100, quebraProg * 100) + '%';
            if (quebraProg >= 1) { destruir(a, true); quebrando = null; quebraProg = 0; crackMesh.visible = false; desenharRachadura(0); $('#breakbar').style.display = 'none'; } }
        } else { quebrando = null; crackMesh.visible = false; $('#breakbar').style.display = 'none'; }
      }
    }
    renderer.render(cena, cam);
  }
  requestAnimationFrame(loop);
}
loop();
